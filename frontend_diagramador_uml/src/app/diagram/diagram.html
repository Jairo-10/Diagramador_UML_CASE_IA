<div class="app-layout bg-slate-950 text-slate-100 h-screen w-screen flex overflow-hidden font-sans select-none relative">
  
  <!-- 1. PANEL IZQUIERDO FIJO: PALETA & MODELADO UML -->
  <app-side-panel #sidePanel class="h-full flex-shrink-0 z-20"></app-side-panel>

  <!-- 2. ÁREA CENTRAL: LIENZO DE DIBUJO JOINTJS -->
  <div class="canvas-wrapper flex-1 relative flex flex-col h-full overflow-hidden bg-slate-100" cdkDropListGroup>
    
    <!-- BARRA SUPERIOR FLOTANTE -->
    <div class="absolute top-4 left-4 right-4 z-10 flex items-center justify-between pointer-events-none">
      
      <!-- Chip Izquierdo: Estado de Sala & P2P -->
      <div class="pointer-events-auto flex items-center gap-2.5 px-3.5 py-1.5 rounded-xl bg-white/95 border border-slate-200/90 backdrop-blur-md shadow-md text-slate-800">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-xs font-bold text-slate-800 font-['Outfit']">Lienzo Colaborativo</span>
        <span class="text-[10px] text-slate-500 font-mono bg-slate-100 px-2 py-0.5 rounded-md border border-slate-200">En Línea</span>
      </div>

      <!-- Botón Superior Derecho: Abrir Panel de Exportación & Auditoría -->
      <button 
        (click)="sidePanel.toggleRightDrawer()"
        class="pointer-events-auto flex items-center gap-2 px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white text-xs font-bold shadow-lg shadow-indigo-600/30 hover:scale-[1.02] active:scale-[0.98] transition cursor-pointer">
        <span>📦 Exportar & Herramientas</span>
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75" />
        </svg>
      </button>
    </div>

    <!-- CONTENEDOR DEL LIENZO SVG (JOINTJS) -->
    <div #paperContainer class="diagram-container flex-1 w-full h-full cursor-default" cdkDropList>
      <!-- JointJS Canvas -->
    </div>

    <!-- WIDGET FLOTANTE DE ZOOM (Esquina Inferior Derecha) -->
    <div class="absolute bottom-5 right-5 z-10 flex items-center gap-1 p-1.5 rounded-2xl bg-white/95 border border-slate-200 backdrop-blur-md shadow-xl text-slate-700">
      <button 
        (click)="zoomIn()" 
        title="Acercar (Zoom In)"
        class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-700 flex items-center justify-center text-sm font-bold transition active:scale-95 cursor-pointer">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
      </button>

      <button 
        (click)="zoomOut()" 
        title="Alejar (Zoom Out)"
        class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-700 flex items-center justify-center text-sm font-bold transition active:scale-95 cursor-pointer">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4" />
        </svg>
      </button>

      <div class="w-[1px] h-4 bg-slate-300 mx-0.5"></div>

      <button 
        (click)="resetZoom()" 
        title="Restablecer Zoom (100%)"
        class="px-2.5 h-8 rounded-xl bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-700 flex items-center justify-center text-xs font-semibold font-mono transition active:scale-95 cursor-pointer">
        100%
      </button>
    </div>

  </div>

</div>
